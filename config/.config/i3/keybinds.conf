### Keybinds ###

# CORE LAUNCHERS

bindsym $mod+Return exec ${TERMINAL:-alacritty}
bindsym $mod+r exec --no-startup-id ~/.config/rofi/scripts/menu.sh
bindsym $mod+e exec --no-startup-id rofi -show drun
bindsym $mod+t exec --no-startup-id ~/.config/rofi/scripts/tmux.sh
bindsym $mod+Tab exec --no-startup-id ~/.config/rofi/scripts/windows.sh

# NAVIGATION

bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right

# WINDOW MOVEMENT

bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right

# WINDOW DESTRUCTION

bindsym $mod+Shift+x kill

# LAYOUT CONTROL

bindsym $mod+Ctrl+h split h
bindsym $mod+Ctrl+v split v
bindsym $mod+Ctrl+s layout stacking
bindsym $mod+Ctrl+t layout tabbed
bindsym $mod+Ctrl+space layout toggle split

# WINDOW STATES

bindsym $mod+f fullscreen toggle
bindsym $mod+s sticky toggle
bindsym $mod+Shift+f floating toggle
bindsym $mod+space focus mode_toggle
bindsym $mod+q focus parent
floating_modifier $mod

# SCRATCHPAD

bindsym $mod+u move scratchpad
bindsym $mod+i exec --no-startup-id ~/.config/rofi/scripts/scratchpads.sh

# SYSTEM

bindsym $mod+Shift+r restart
bindsym $mod+Ctrl+c reload

# ZEN / FOCUS MODE (Optional)

bindsym $mod+z exec ~/.local/bin/i3-center-window

# SWITCH TO WORKSPACE

bindsym $mod+1 workspace $ws1
bindsym $mod+2 workspace $ws2
bindsym $mod+3 workspace $ws3
bindsym $mod+4 workspace $ws4
bindsym $mod+5 workspace $ws5
bindsym $mod+6 workspace $ws6
bindsym $mod+7 workspace $ws7
bindsym $mod+8 workspace $ws8
bindsym $mod+9 workspace $ws9
bindsym $mod+0 workspace $ws10

# MOVE FOCUSED CONTAINER TO WORKSPACE

bindsym $mod+Shift+1 move container to workspace $ws1
bindsym $mod+Shift+2 move container to workspace $ws2
bindsym $mod+Shift+3 move container to workspace $ws3
bindsym $mod+Shift+4 move container to workspace $ws4
bindsym $mod+Shift+5 move container to workspace $ws5
bindsym $mod+Shift+6 move container to workspace $ws6
bindsym $mod+Shift+7 move container to workspace $ws7
bindsym $mod+Shift+8 move container to workspace $ws8
bindsym $mod+Shift+9 move container to workspace $ws9
bindsym $mod+Shift+0 move container to workspace $ws10

## XFREE86 MULTIMEDIA KEY ------------------------------------------------------

bindsym XF86AudioMute exec "amixer -q sset Master,0 toggle"
bindsym XF86AudioRaiseVolume exec "amixer -q sset Master,0 1+ unmute"
bindsym XF86AudioLowerVolume exec "amixer -q sset Master,0 1- unmute"
bindsym XF86AudioMicMute exec "amixer -q sset Capture,0 toggle"
bindsym XF86Bluetooth exec "bluetoothctl power on; bluetoothctl connect $(bluetoothctl devices | grep 'Audio' | head -n1 | awk '{print $2}')"
bindsym XF86Display exec "i3lock-fancy"
bindsym XF86Mail exec "${TERMINAL:-alacritty} -e neomutt"
bindsym XF86MonBrightnessUp exec "brightnessctl set +10%"
bindsym XF86MonBrightnessDown exec "brightnessctl set 10%-"
bindsym XF86Tools exec "~/.config/rofi/scripts/system.sh"
bindsym XF86WLAN exec "~/.config/rofi/scripts/wifi.sh"
