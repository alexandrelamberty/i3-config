# GLOBAL APPEARANCE -----------------------------------------------------------

title_align center
default_border pixel 1
font pango:Iosevka Nerd Font 11


# FLOATING CONSTRAINTS --------------------------------------------------------

floating_minimum_size 120 x 50
floating_maximum_size -1 x -1


# GENERIC WINDOW RULES ---------------------------------------------------------

# Default title format
for_window [class=".*"] title_format %title

# Standard terminal title formats
for_window [class="xterm"] title_format %title %class %instance
for_window [class="XTerm"] title_format %title %class %instance

# i3 internal frames
for_window [class="i3-frame"] title_format "%title (%id)"


# MEDIA & PLAYER WINDOWS ----------------------------------------------------

# MPV camera window (video0)
for_window [title="video0 - mpv"] floating enable, sticky enable, border pixel 0, resize set 320 240
no_focus [title="video0 - mpv"]

# MPV general
for_window [class="*mpv"] floating enable

# VLC
for_window [class="vlc"] floating enable, resize set 1200 600


# TERMINALS (Centered Floating Presets) ---------------------------------------

for_window [class="Alacritty"] \
    title_format %title %class %instance, floating enable, resize set 1210 566, move position center

for_window [class="XTerm"] \
    floating enable, resize set 1200 600, move position center

for_window [class="Zutty"] \
    floating enable, resize set 1200 600


# FILE MANAGERS ----------------------------------------------------------------

for_window [class="Pcmanfm"] floating enable, resize set 1200 600
for_window [class="Nemo"] floating enable, resize set 1200 600


# UTILITIES & CONFIG TOOLS

for_window [class="Nitrogen"] floating enable, resize set 800 420
for_window [class="Transmission-gtk"] floating enable, resize set 800 420

# Widgets
for_window [class="Blueman-manager"] floating enable, resize set 800 420
for_window [class="gnome-disk-image-mounter"] floating enable, resize set 800 420

# Command palettes
for_window [class="Command-palette"] floating enable, resize set 800 420, move position center

# NOTE / PROJECT FLOATING DOCUMENT WINDOWS -------------------------------------

for_window [title="~/notes/*"] \
    floating enable, resize set 800 1000, move position center

for_window [title="~/projets/*"] \
    floating enable, resize set 800 1200, move position center